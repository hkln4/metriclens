name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy prefit
      - name: Benchmark manifest matches the shipped rules and the package version
        run: python benchmarks/check_manifest.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # -n auto: tests run in parallel (conftest gives each worker one OpenMP/BLAS thread)
      - run: pytest -q -n auto --cov=prefit --cov-report=term
      - name: HTML smoke test (CLI end to end)
        run: |
          python - <<'PY'
          from sklearn.datasets import load_breast_cancer
          load_breast_cancer(as_frame=True).frame.to_csv("bc.csv", index=False)
          PY
          prefit report bc.csv --target target --verify --max-experiments 2 --out smoke.html --json smoke.json
          python -c "import json,re; h=open('smoke.html').read(); json.load(open('smoke.json')); ids=set(re.findall(r'id=\"([^\"]+)\"',h)); bad=set(re.findall(r'href=\"#([^\"]+)\"',h))-ids; assert not bad, bad; print('ok', len(h))"

  core-only:
    # the deterministic core must work without scikit-learn / scipy / plotly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: |
          python - <<'PY'
          import numpy as np, pandas as pd, prefit as pf
          rng = np.random.default_rng(0)
          df = pd.DataFrame({"a": rng.normal(size=2000), "y": (rng.random(2000) < .1).astype(int)})
          r = pf.analyze(df, "y")
          assert r.decisions and "<!doctype html>" in r.to_html()
          print(r)
          PY
