[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prefit"
version = "0.4.0"
description = "Decision-driven EDA for tabular supervised learning: evidence-backed, verifiable pre-training decisions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hkln4" }]
keywords = ["machine-learning", "eda", "evaluation", "scikit-learn", "data-profiling", "leakage",
            "cross-validation", "model-evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# The deterministic core (profile, rules, report, HTML) needs only these.
# Loose lower bounds: exact pins belong to applications, not libraries.
dependencies = [
    "pydantic>=2",
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
# experiments, export to sklearn Pipeline
verify = ["scikit-learn>=1.4", "scipy>=1.9"]
# only needed for to_html(plotlyjs="inline") — offline single-file reports
report = ["plotly>=5"]
llm = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
all = ["prefit[verify,report,llm]"]
dev = [
    "prefit[verify,report]",
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.8",
    "pandas-stubs",
]

[project.scripts]
prefit = "prefit.cli:main"

[project.urls]
Homepage = "https://hkln4.github.io/prefit/"
"Example report" = "https://hkln4.github.io/prefit/report.html"
Repository = "https://github.com/hkln4/prefit"
Issues = "https://github.com/hkln4/prefit/issues"
Changelog = "https://github.com/hkln4/prefit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["prefit"]

[tool.hatch.build.targets.sdist]
include = ["prefit", "tests", "benchmarks/*.py", "README.md", "CHANGELOG.md", "LICENSE", "ARCHITECTURE.md",
           "CONTRIBUTING.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "B008", "UP007", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"benchmarks/*" = ["S"]
"examples/*" = ["S"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: experiments with real models, simulations, timing (deselect with -m 'not slow')",
    "network: downloads real datasets into ~/.cache/prefit (skipped when offline)",
]

[tool.coverage.run]
source = ["prefit"]
omit = ["prefit/llm/anthropic.py", "prefit/llm/gemini.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
